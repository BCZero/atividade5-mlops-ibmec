# PIPELINE DEFINITION
# Name: pipeline-mlops-pcdf
# Description: Extracao -> limpeza -> treino -> avaliacao -> salvar modelo, rodando no cluster Kind (Aula 07).
# Inputs:
#    limiar_minimo: float [Default: 0.6]
components:
  comp-avaliar:
    executorLabel: exec-avaliar
    inputDefinitions:
      artifacts:
        entrada:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        modelo:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        random_state:
          defaultValue: 42.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        metricas:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
  comp-extrair:
    executorLabel: exec-extrair
    outputDefinitions:
      artifacts:
        saida:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-limpar:
    executorLabel: exec-limpar
    inputDefinitions:
      artifacts:
        entrada:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        saida:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-salvar-modelo:
    executorLabel: exec-salvar-modelo
    inputDefinitions:
      artifacts:
        modelo:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        acuracia:
          parameterType: NUMBER_DOUBLE
        limiar_minimo:
          defaultValue: 0.6
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        destino:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
  comp-treinar:
    executorLabel: exec-treinar
    inputDefinitions:
      artifacts:
        entrada:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        random_state:
          defaultValue: 42.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        modelo:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-avaliar:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - avaliar
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef avaliar(\n    entrada: Input[Dataset],\n    modelo: Input[Model],\n\
          \    metricas: Output[Metrics],\n    random_state: int = 42,\n) -> float:\n\
          \    \"\"\"Refaz o MESMO split (mesmo random_state) pra isolar o conjunto\
          \ de\n    teste que o treino nao viu, e calcula acuracia/precisao/revocacao.\n\
          \    Devolve a acuracia -- e o valor que salvar_modelo usa como gate.\"\"\
          \"\n    import joblib\n    import pandas as pd\n    from sklearn.metrics\
          \ import accuracy_score, precision_score, recall_score\n    from sklearn.model_selection\
          \ import train_test_split\n    from sklearn.preprocessing import LabelEncoder\n\
          \n    FEATURE_COLS = [\"natureza\", \"bairro\", \"turno\"]\n    TARGET_COL\
          \ = \"houve_violencia\"\n\n    df = pd.read_csv(entrada.path)\n    df_modelo\
          \ = df[FEATURE_COLS + [TARGET_COL]].dropna()\n\n    for col in FEATURE_COLS:\n\
          \        le = LabelEncoder()\n        df_modelo[col] = le.fit_transform(df_modelo[col].astype(str))\n\
          \n    X = df_modelo[FEATURE_COLS]\n    y = df_modelo[TARGET_COL].astype(bool)\n\
          \n    _, X_test, _, y_test = train_test_split(\n        X, y, test_size=0.3,\
          \ random_state=random_state\n    )\n\n    clf = joblib.load(modelo.path)\n\
          \    y_pred = clf.predict(X_test)\n\n    acc = float(accuracy_score(y_test,\
          \ y_pred))\n    prec = float(precision_score(y_test, y_pred, zero_division=0))\n\
          \    rec = float(recall_score(y_test, y_pred, zero_division=0))\n\n    metricas.log_metric(\"\
          acuracia\", acc)\n    metricas.log_metric(\"precisao\", prec)\n    metricas.log_metric(\"\
          revocacao\", rec)\n\n    print(f\"avaliacao: acuracia={acc:.2%} precisao={prec:.2%}\
          \ revocacao={rec:.2%}\")\n    return acc\n\n"
        image: SEU-USUARIO-DOCKERHUB/aula7-mlops-pcdf:latest
    exec-extrair:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - extrair
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef extrair(saida: Output[Dataset]):\n    \"\"\"Simula a extracao\
          \ de uma fonte de dados bruta. Em producao seria um\n    banco de dados\
          \ ou uma API; aqui e o CSV que ja vem EMBUTIDO na imagem\n    Docker (copiado\
          \ em /app/data/bos_sinteticos.csv no Dockerfile) -- por\n    isso alterar\
          \ o dado de treino = editar o CSV + rebuild da imagem.\"\"\"\n    import\
          \ shutil\n\n    shutil.copy(\"/app/data/bos_sinteticos.csv\", saida.path)\n\
          \    print(f\"extracao: copiado /app/data/bos_sinteticos.csv -> {saida.path}\"\
          )\n\n"
        image: SEU-USUARIO-DOCKERHUB/aula7-mlops-pcdf:latest
    exec-limpar:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - limpar
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef limpar(entrada: Input[Dataset], saida: Output[Dataset]):\n  \
          \  \"\"\"Mesma normalizacao (minusculas + strip) e validacao de schema da\n\
          \    Aula 06 (src/etl_utils.py) -- aqui reescrita inline porque cada\n \
          \   componente KFP roda isolado, em seu proprio pod.\"\"\"\n    import pandas\
          \ as pd\n\n    REQUIRED_COLUMNS = [\n        \"id\", \"texto_relato\", \"\
          natureza\", \"bairro\", \"turno\",\n        \"dia_semana\", \"houve_violencia\"\
          , \"valor_prejuizo_reais\",\n        \"idade_vitima\", \"reincidencia\"\
          ,\n    ]\n\n    df = pd.read_csv(entrada.path)\n\n    faltando = [c for\
          \ c in REQUIRED_COLUMNS if c not in df.columns]\n    if faltando:\n    \
          \    raise ValueError(f\"colunas faltando no dataset: {faltando}\")\n\n\
          \    for col in (\"natureza\", \"bairro\", \"turno\"):\n        df[col]\
          \ = df[col].astype(str).str.lower().str.strip()\n\n    df.to_csv(saida.path,\
          \ index=False)\n    print(f\"limpeza: {len(df)} linhas normalizadas -> {saida.path}\"\
          )\n\n"
        image: SEU-USUARIO-DOCKERHUB/aula7-mlops-pcdf:latest
    exec-salvar-modelo:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - salvar_modelo
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef salvar_modelo(\n    modelo: Input[Model],\n    acuracia: float,\n\
          \    destino: Output[Model],\n    limiar_minimo: float = LIMIAR_MINIMO,\n\
          ):\n    \"\"\"Gate de governanca: s\xF3 promove o modelo se a acuracia bater\
          \ o\n    limiar minimo -- do contrario FALHA o pipeline de proposito (mesmo\n\
          \    espirito do tests/test_model_threshold.py da Aula 06, agora como\n\
          \    etapa do pr\xF3prio pipeline, nao s\xF3 do CI).\"\"\"\n    import shutil\n\
          \n    if acuracia < limiar_minimo:\n        raise RuntimeError(\n      \
          \      f\"acuracia {acuracia:.2%} abaixo do limiar minimo de \"\n      \
          \      f\"{limiar_minimo:.0%} -- pipeline NAO deve promover este modelo\"\
          \n        )\n\n    shutil.copy(modelo.path, destino.path)\n    print(f\"\
          modelo promovido: acuracia {acuracia:.2%} >= limiar {limiar_minimo:.0%}\"\
          )\n\n"
        image: SEU-USUARIO-DOCKERHUB/aula7-mlops-pcdf:latest
    exec-treinar:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - treinar
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef treinar(entrada: Input[Dataset], modelo: Output[Model], random_state:\
          \ int = 42):\n    \"\"\"Treina o mesmo DecisionTreeClassifier das Aulas\
          \ 05/06, agora dentro\n    de um pod do cluster. Salva o modelo treinado\
          \ com joblib.\"\"\"\n    import joblib\n    import pandas as pd\n    from\
          \ sklearn.model_selection import train_test_split\n    from sklearn.preprocessing\
          \ import LabelEncoder\n    from sklearn.tree import DecisionTreeClassifier\n\
          \n    FEATURE_COLS = [\"natureza\", \"bairro\", \"turno\"]\n    TARGET_COL\
          \ = \"houve_violencia\"\n\n    df = pd.read_csv(entrada.path)\n    df_modelo\
          \ = df[FEATURE_COLS + [TARGET_COL]].dropna()\n\n    for col in FEATURE_COLS:\n\
          \        le = LabelEncoder()\n        df_modelo[col] = le.fit_transform(df_modelo[col].astype(str))\n\
          \n    X = df_modelo[FEATURE_COLS]\n    y = df_modelo[TARGET_COL].astype(bool)\n\
          \n    X_train, _, y_train, _ = train_test_split(\n        X, y, test_size=0.3,\
          \ random_state=random_state\n    )\n\n    clf = DecisionTreeClassifier(max_depth=3,\
          \ random_state=random_state)\n    clf.fit(X_train, y_train)\n\n    joblib.dump(clf,\
          \ modelo.path)\n    print(f\"treino: modelo salvo em {modelo.path} ({len(X_train)}\
          \ linhas de treino)\")\n\n"
        image: SEU-USUARIO-DOCKERHUB/aula7-mlops-pcdf:latest
pipelineInfo:
  description: Extracao -> limpeza -> treino -> avaliacao -> salvar modelo, rodando
    no cluster Kind (Aula 07).
  name: pipeline-mlops-pcdf
root:
  dag:
    tasks:
      avaliar:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-avaliar
        dependentTasks:
        - limpar
        - treinar
        inputs:
          artifacts:
            entrada:
              taskOutputArtifact:
                outputArtifactKey: saida
                producerTask: limpar
            modelo:
              taskOutputArtifact:
                outputArtifactKey: modelo
                producerTask: treinar
        taskInfo:
          name: avaliar
      extrair:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-extrair
        taskInfo:
          name: extrair
      limpar:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-limpar
        dependentTasks:
        - extrair
        inputs:
          artifacts:
            entrada:
              taskOutputArtifact:
                outputArtifactKey: saida
                producerTask: extrair
        taskInfo:
          name: limpar
      salvar-modelo:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-salvar-modelo
        dependentTasks:
        - avaliar
        - treinar
        inputs:
          artifacts:
            modelo:
              taskOutputArtifact:
                outputArtifactKey: modelo
                producerTask: treinar
          parameters:
            acuracia:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: avaliar
            limiar_minimo:
              componentInputParameter: limiar_minimo
        taskInfo:
          name: salvar-modelo
      treinar:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-treinar
        dependentTasks:
        - limpar
        inputs:
          artifacts:
            entrada:
              taskOutputArtifact:
                outputArtifactKey: saida
                producerTask: limpar
        taskInfo:
          name: treinar
  inputDefinitions:
    parameters:
      limiar_minimo:
        defaultValue: 0.6
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
